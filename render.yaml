services:
  - type: web
    name: careerpilot-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_PORT
        value: 4000
      - key: PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH
        value: /usr/bin/chromium
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
      - key: AUTO_APPLY_DOMAINS
        value: boards.greenhouse.io,jobs.lever.co,jobs.ashbyhq.com,apply.workable.com,jobs.smartrecruiters.com,wellfound.com,internshala.com
      - key: AUTO_APPLY_DAILY_LIMIT
        value: "20"
      - key: AUTO_APPLY_CONCURRENCY
        value: "2"
      - key: AUTO_APPLY_SWEEP_CRON
        value: "0 */2 * * *"
      - key: USE_MOCK_SOURCES
        value: "false"
      - key: SOURCE_TIMEOUT_MS
        value: "20000"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: ap-south-1
      - key: S3_BUCKET
        value: careepilot-documents
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
